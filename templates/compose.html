{% extends "base.html" %}
{% block content %}
<div class="container">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h3>✉️ Compose Mail</h3>
  </div>
  <div class="card shadow-sm">
    <div class="card-body p-4">
      <form method="post">
        {% csrf_token %}
        <div class="mb-4">
          <label class="form-label">👤 To (username)</label>
          <input type="text" name="to" class="form-control" value="{{ form.to.value|default_if_none:'' }}" placeholder="Enter recipient username" required>
          {{ form.to.errors }}
        </div>
        <div class="mb-4">
          <label class="form-label">📝 Subject</label>
          <input type="text" name="subject" class="form-control" value="{{ form.subject.value|default_if_none:'' }}" placeholder="Enter email subject" required>
          {{ form.subject.errors }}
        </div>
        <div class="mb-4">
          <label class="form-label">💬 Message</label>
          <textarea name="body" class="form-control" rows="10" placeholder="Write your message here..." required>{{ form.body.value|default_if_none:'' }}</textarea>
          {{ form.body.errors }}
        </div>
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary">
            <span style="margin-right: 8px;">🚀</span> Send Mail
          </button>
          <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
